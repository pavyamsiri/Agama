[build-system]
requires = ["setuptools", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "agama"
version = "1.0"
description = "Action-based galaxy modelling architecture"
readme = "README"
requires-python = ">=2.7"
license = { file = "LICENSE" }
authors = [
    {name = "Eugene Vasiliev", email = "eugvas@protonmail.com"}
]
dependencies = [
    "numpy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://github.com/GalacticDynamics-Oxford/Agama"
Download = "https://github.com/GalacticDynamics-Oxford/Agama/archive/master.zip"

